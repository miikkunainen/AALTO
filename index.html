<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A’labora – pajojen työympäristö (demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --paper:#EFEFEF;--panel:#FFFFFF;--ink:#000000;--mute:#595959;--line:#D2D2D2;--line2:#E6E6E6;
  --blue:#0069B4;--blue-s:#DCEFFD;--yel:#FFE01B;--yel-s:#FFF6C2;--grn:#17784A;--grn-s:#DDF1E5;--abl:#0AA0F5;
  --rust:#C4321E;--rust-s:#FBE2DD;--bp:#00599B;--r1:0;--r2:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{margin:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-stretch:72%;font-weight:760;line-height:1.1;margin:0;letter-spacing:-.003em}
h1{font-size:30px}h2{font-size:21px;margin-bottom:10px}h3{font-size:16.5px}
p{margin:0 0 8px}
.mute{color:var(--mute)}.small{font-size:13px}.nowrap{white-space:nowrap}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

/* yläpalkki */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.brand{font-stretch:62%;font-weight:800;font-size:27px;letter-spacing:.01em;line-height:1}
.brand span{color:var(--yel)}
.top .sp{flex:1}
.who{font-size:13px;line-height:1.2;text-align:right}
.who b{display:block;font-weight:600}
.hoodbtn{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.hoodbtn[aria-pressed="true"]{background:#fff;color:var(--bp);border-color:#fff}
.out{background:none;border:0;color:#fff;opacity:.8;font-size:13px;text-decoration:underline;padding:4px}
.nav{display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:50px;z-index:19;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:12px 11px 9px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.nav button.on{color:var(--ink);border-bottom-color:var(--yel)}
main{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
body.hood main{background-image:linear-gradient(rgba(28,79,140,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(28,79,140,.07) 1px,transparent 1px);background-size:24px 24px}
body.hood .top{background:var(--bp)}
.hoodnote{display:none}
body.hood .hoodnote{display:block;background:var(--bp);color:#fff;font-size:13px;padding:8px 16px;text-align:center}

/* rakenteet */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:18px}
.head p{margin:4px 0 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line2);color:var(--ink);white-space:nowrap;vertical-align:1px}
.tag.l{background:var(--yel-s);color:#6b5208}.tag.h{background:var(--grn-s);color:#234d33}.tag.k{background:var(--blue-s);color:#1d4268}.tag.t{background:var(--rust-s);color:#7a2f18}.tag.ai{background:#EADFF5;color:#4a2a6e}
.btn{font-weight:600;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:var(--r1);font-size:14.5px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.w{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.s{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r1);background:#fff;color:var(--ink);width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:13.5px}
.back{background:none;border:0;color:var(--blue);font-weight:600;padding:0;margin-bottom:12px}
.note{background:var(--yel-s);border-left:4px solid var(--yel);padding:10px 12px;border-radius:var(--r1);font-size:14px;margin:10px 0}
.note.b{background:var(--blue-s);border-left-color:var(--blue)}
.note.r{background:var(--rust-s);border-left-color:var(--rust)}
.note.g{background:var(--grn-s);border-left-color:var(--grn)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.low{color:var(--rust);font-weight:600}

/* konepellin alla */
.prov{display:none}
body.hood .prov{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:8px;padding:8px 10px;border:1px dashed var(--bp);border-radius:var(--r1);background:rgba(220,230,241,.75);color:var(--bp);font-size:12.5px;line-height:1.4}
body.hood .prov b{font-weight:600}
body.hood td .prov{min-width:240px}

/* koneet */
.mach{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--grn);border-radius:var(--r1);padding:10px 12px}
.mach.warn{border-left-color:var(--yel)}.mach.bad{border-left-color:var(--rust)}
.mgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.alarm{display:block;width:100%;background:var(--yel);color:var(--ink);border:2px solid var(--ink);font-stretch:72%;font-weight:800;font-size:21px;padding:14px 18px;border-radius:var(--r2);text-align:left;margin-bottom:18px}
.alarm small{display:block;font-stretch:100%;font-weight:500;font-size:13px}

/* tasot */
.lv{display:inline-flex;gap:3px;vertical-align:middle}
.lv i{width:15px;height:8px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--ink)}
.lv i.half{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,var(--line) 2px 4px)}

/* työkortti */
.phase{border-top:1px solid var(--line2);padding:14px 0;display:grid;grid-template-columns:34px 1fr;gap:10px}
.phase .no{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.phase.valmis .no{background:var(--ink);color:#fff}
.phase.kesken .no{background:var(--yel)}
.phase.odottaa{opacity:.85}
.next{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);padding:9px 11px;border-radius:var(--r1);margin-top:8px;font-size:14px}
.mat{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0}
.cost td{font-size:14.5px}
.cost tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.keys{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:16px}
.key{border:1px solid var(--line);border-radius:var(--r2);padding:14px;background:var(--panel)}
.key.lehtori{border-top:4px solid var(--blue)}.key.paja{border-top:4px solid var(--grn)}
.key.paja.odottaa{border-top-color:var(--yel)}.key.paja.palautettu{border-top-color:var(--rust)}

/* kommentit */
.cm{padding:8px 0 8px 12px;border-left:3px solid var(--line);margin-top:10px}
.cm.r-pajamestari{border-left-color:var(--grn)}.cm.r-lehtori{border-left-color:var(--blue)}.cm.r-opiskelija{border-left-color:var(--yel)}.cm.r-koordinaattori{border-left-color:var(--mute)}
.cm .cm{margin-left:14px}
.cm .meta{font-size:12.5px;color:var(--mute)}
.cm .meta b{color:var(--ink)}
.cm p{margin:3px 0}
.rep{background:none;border:0;color:var(--blue);font-size:13px;font-weight:600;padding:0}

/* kuorma */
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px}
.bar i{display:block;width:100%;max-width:46px;background:var(--ink);border-radius:3px 3px 0 0}
.bar.now i{background:var(--yel)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:7px 12px;font-weight:600;font-size:13.5px}
.chip:active{background:var(--yel)}

/* kalenteri */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px;min-height:160px}
.day.today{border:2px solid var(--ink)}
.day h3{margin-bottom:8px}
.ev{border-left:4px solid var(--line);padding:4px 7px;margin-bottom:6px;background:#fff;border-radius:0 var(--r1) var(--r1) 0;font-size:13px;line-height:1.3}
.ev.hoito{border-left-color:var(--yel)}.ev.syva{border-left-color:var(--blue)}.ev.kehitys{border-left-color:#7a4fa8}.ev.huolto{border-left-color:var(--rust)}.ev.kurssi{border-left-color:var(--grn)}.ev.varaus{border-left-color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
@media (max-width:760px){.week{grid-template-columns:1fr}.day{min-height:0}}

/* kirjautuminen */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lhero{background:var(--ink);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:flex-end}
.brandbig{font-stretch:62%;font-weight:800;font-size:clamp(72px,13vw,168px);line-height:.85;letter-spacing:-.01em}
.brandbig span{color:var(--yel)}
.lhero .lead{font-size:18px;max-width:30em;margin-top:22px;line-height:1.45}
.lhero .demo{font-size:13px;opacity:.7;margin-top:12px}
.lpick{padding:40px 32px;overflow:auto}
.lpick h2{margin:22px 0 8px;font-size:17px}
.lpick h2:first-child{margin-top:0}
.ubtn{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;margin-bottom:6px;color:var(--ink)}
.ubtn.on{border:2px solid var(--ink);background:#fff}
.ubtn small{display:block;color:var(--mute);font-size:12.5px}
.pwbox{background:#fff;border:2px solid var(--ink);border-radius:var(--r2);padding:16px;margin:14px 0 6px}
.err{color:var(--rust);font-weight:600;font-size:14px;margin-top:6px}
@media (max-width:820px){.login{grid-template-columns:1fr}.lhero{padding:36px 22px 30px}.lpick{padding:24px 16px}}

/* modaali */
.ov{position:fixed;inset:0;background:rgba(18,28,34,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:var(--panel);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.md .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--mute);padding:0 4px}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:14px}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.instbody{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r1);padding:12px;font-size:14px;line-height:1.55}
.rrow{border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin-bottom:10px;background:#fff}
.rrow.new{border-left:5px solid var(--yel)}.rrow.match{border-left:5px solid var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.foot{max-width:1120px;margin:0 auto;padding:0 16px 40px;font-size:12.5px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.md{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}}

/* ---- Aalto-henkinen visuaalinen kieli ---- */
h1,h2,h3{font-stretch:100%;font-weight:700;letter-spacing:-.02em}
h1{font-size:clamp(28px,4.2vw,44px);line-height:1.05}
h2{font-size:20px}
.top{background:#000;padding:10px 16px}
.brand{font-stretch:100%;font-weight:800;font-size:24px;letter-spacing:-.03em}
.brand span{color:var(--yel)}
.nav{top:56px;border-bottom:1px solid var(--line)}
.nav button{color:#4a4a4a}
.nav button.on{color:#000;border-bottom-color:#000}
.box{border:0}
.hoodbtn{border-radius:0}
.tabs button{border-radius:0}
.tabs button.on{background:#000;border-color:#000}
.tag{border-radius:0;font-weight:600}
.btn{border-width:2px}
.btn.p{background:#000;border-color:#000}
.chip{border-radius:0;border-width:2px}
.chip:active,.chip:hover{background:var(--yel)}
.alarm{border-radius:0;border:0;border-left:8px solid var(--rust);background:#fff;font-size:18px;padding:12px 16px;font-stretch:100%;font-weight:700;letter-spacing:-.02em}
.mach{border-left-width:8px}
body.hood .top{background:var(--abl)}
body.hood .hoodnote{background:var(--abl);color:#000}
body.hood .prov{border-color:var(--abl);background:rgba(10,160,245,.08);color:#00406f}
body.hood main{background-image:linear-gradient(rgba(10,160,245,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(10,160,245,.10) 1px,transparent 1px)}
.lhero{background:#000}
.brandbig{font-stretch:100%;font-weight:800;font-size:clamp(120px,22vw,300px);line-height:.8;letter-spacing:-.05em}
.brandbig span{color:var(--yel)}
.lock{font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.15;letter-spacing:-.02em;margin-top:18px}
.lock small{display:block;font-weight:500;font-size:16px;opacity:.75;letter-spacing:0;margin-top:6px}
.ubtn{border-radius:0;border:0;border-left:4px solid transparent}
.ubtn.on{border:0;border-left:4px solid #000}
.pwbox{border-radius:0}
.md{border-radius:0}
.day{border:0}.day.today{border:0;box-shadow:inset 0 4px 0 #000}
.key{border:0}
.key.lehtori{border-top:6px solid var(--abl)}.key.paja{border-top:6px solid var(--grn)}.key.prof{border-top:6px solid #000;background:var(--panel)}
.key.prof.odottaa{border-top-color:var(--yel)}
.cm.r-professori{border-left-color:#000}.cm.r-lehtori{border-left-color:var(--abl)}
.foot .disc{display:block;margin-bottom:4px}
/* yhdellä silmäyksellä */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;margin-bottom:18px;background:var(--paper)}
.gl{background:var(--panel);padding:14px 16px;text-align:left;border:0;color:#000;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.gl b{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.gl span{font-size:13.5px;font-weight:600;line-height:1.25;margin-top:8px}
.gl.y{background:var(--yel)}.gl.k{background:#000;color:#fff}.gl.bl{background:var(--abl);color:#000}
button.gl{cursor:pointer}button.gl:hover{outline:2px solid #000;outline-offset:-2px}
.nextstep{background:var(--yel);padding:20px 22px;margin-bottom:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.nextstep .k{font-size:13px;font-weight:700}
.nextstep h2{font-size:clamp(24px,3.4vw,34px);margin:4px 0 8px;line-height:1.1}
.nextstep p{max-width:62ch;margin:0}
.nextstep .blk{margin-top:10px;font-size:14px;font-weight:600}
@media (max-width:620px){.nextstep{grid-template-columns:1fr}}
.path{width:100%;border-collapse:separate;border-spacing:3px;min-width:520px;table-layout:fixed}
.path th:first-child{width:34%}
.path th{font-size:12.5px;color:var(--mute);font-weight:600;text-align:left;padding:4px 6px;border:0}
.path td{border:0;padding:0;height:38px;background:var(--line2)}
.path td.m{background:transparent;padding:4px 6px;font-weight:600;font-size:14px;width:34%}
.path td.d{background:#000}
.path td.p{background:repeating-linear-gradient(45deg,#000 0 3px,var(--yel) 3px 9px)}
.path td.need{box-shadow:inset 0 0 0 2px var(--abl)}
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--paper);margin-bottom:16px}
.chain>div{background:var(--panel);padding:16px;position:relative}
.chain>div:not(:last-child)::after{content:'';position:absolute;right:-9px;top:26px;width:0;height:0;border-left:9px solid #000;border-top:9px solid transparent;border-bottom:9px solid transparent;z-index:1}
.chain .who2{font-size:12.5px;font-weight:700;color:var(--mute)}
.chain h3{font-size:19px;margin:2px 0 6px}
.chain .cnt{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:10px}
.chain .cl{font-size:13px;font-weight:600}
.chain>div.c1{box-shadow:inset 0 6px 0 #000}.chain>div.c2{box-shadow:inset 0 6px 0 var(--abl)}.chain>div.c3{box-shadow:inset 0 6px 0 var(--grn)}.chain>div.c4{box-shadow:inset 0 6px 0 var(--yel)}
@media (max-width:760px){.chain{grid-template-columns:1fr 1fr}.chain>div::after{display:none}}
.open{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.open i{width:12px;height:12px;border-radius:50%;background:var(--grn);display:inline-block}
.open.no i{background:var(--rust)}
.mtx{border-collapse:collapse;min-width:0}
.mtx td,.mtx th{text-align:center;padding:8px}
.mtx td.c{font-weight:800;font-size:18px}

/* hätätila */
.sos{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-bottom:18px}
.sosbtn{background:var(--rust);color:#fff;border:0;text-align:left;padding:16px 18px;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.sosbtn small{display:block;font-size:13px;font-weight:600;letter-spacing:0;margin-top:4px;opacity:.9}
.sos .alarm{margin:0;border-left:0;background:#fff;font-size:17px}
@media (max-width:560px){.sos{grid-template-columns:1fr}}
body.emon{overflow:hidden}
.em{position:fixed;inset:0;z-index:100;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
.emtop{position:sticky;top:0;z-index:2;background:var(--rust);color:#fff;display:flex;justify-content:space-between;gap:10px;padding:12px 18px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.emdots{display:flex;gap:4px;padding:0 18px;max-width:640px;margin:10px auto 0}

function load(){
  var raw=sGet(KEY);
  try{S.db=raw?JSON.parse(raw):null}catch(e){S.db=null}
  if(!S.db||S.db.ver!==3){S.db=seed();save()}
  var ss=sGet(SKEY);
  if(ss&&byId(S.db.users,ss))S.me=ss;
}
var BC=null;try{BC=new BroadcastChannel('alabora')}catch(e){}
function ping(){if(BC){try{BC.postMessage(Date.now())}catch(e){}}}
function save(){sSet(KEY,JSON.stringify(S.db));ping()}
var lastEm='';
function emPublish(){
  var o={active:false};
  if(S.em){var hs=S.em.step>=4?emHelpers():[];var arr=0;hs.forEach(function(x){if(S.em.ack[x.u.id])arr++});
    o={active:true,t0:S.em.t0,step:S.em.step,paja:S.em.paja,type:S.em.type,called:S.em.called,helpers:hs.length,acked:arr}}
  var j=JSON.stringify(o);if(j!==lastEm){lastEm=j;sSet('alabora_em_v1',j);ping()}
}
function me(){return byId(S.db.users,S.me)}
function U(id){return byId(S.db.users,id)||{name:'–',role:''}}
function role(){var m=me();return m?m.role:''}

/* ---------- apufunktiot ---------- */
function stTag(i){
  if(i.state==='luonnos')return '<span class="tag l">Luonnos</span>';
  if(i.reviewDue&&i.reviewDue<dOff(0))return '<span class="tag t">Tarkastettava</span>';
  if(i.uses>0)return '<span class="tag h">Hyväksytty</span> <span class="tag k">Käytössä '+i.uses+' työssä</span>';
  return '<span class="tag h">Hyväksytty</span>';
}
function aiTag(i){return i.ai?' <span class="tag ai">Tekoälyavusteinen luonnos</span>':''}
function lvBar(n,half){var h='<span class="lv" aria-label="Taso '+n+' / 4: '+esc(LV[n]||'')+'">';for(var i=1;i<=4;i++){h+='<i class="'+(i<n?'on':(i===n?(half?'half':'on'):''))+'"></i>'}return h+'</span>'}
function prov(rows){var h='<div class="prov">';for(var i=0;i<rows.length;i++){h+='<b>'+esc(rows[i][0])+'</b><span>'+esc(rows[i][1])+'</span>'}return h+'</div>'}
function machState(m){
  if(m.status==='vika')return ['bad','Vika, käyttökielto'];
  var since=m.use-m.last;
  if(since>=m.interval)return ['bad','Huolto erääntynyt'];
  if(since>=m.interval*0.85)return ['warn','Huolto lähestyy'];
  return ['','Kunnossa'];
}
function userLevel(uidv,mid){
  var best=0,prog=0;
  S.db.licenses.forEach(function(l){if(l.user===uidv&&l.machine===mid){if(l.status==='valmis'&&l.level>best)best=l.level;if(l.status==='vaiheessa'&&l.level>prog)prog=l.level}});
  return {done:best,prog:prog};
}
function itemOf(m){return m.it?byId(S.db.inventory,m.it):null}
function matName(m){var it=itemOf(m);return it?it.name:m.name}
function matPrice(m){var it=itemOf(m);return it?it.price:(m.price||0)}
function matUnit(m){var it=itemOf(m);return it?it.unit:(m.unit||'kpl')}
function cardCost(c){
  var mat=0,machine=0,saved=0,plannedMat=0,plannedMach=0;
  c.phases.forEach(function(p){
    var pm=0;p.mats.forEach(function(m){pm+=m.q*matPrice(m);if(m.src==='kierratys')saved+=(m.value||0)});
    var mc=0;if(p.machine){var mm=byId(S.db.machines,p.machine);if(mm)mc=p.hours*mm.rate}
    plannedMat+=pm;plannedMach+=mc;
    if(p.status!=='odottaa'){mat+=pm;machine+=mc}
  });
  return {mat:mat,machine:machine,total:mat+machine,saved:saved,planned:plannedMat+plannedMach};
}
function visibleCards(){var m=me();if(isStudent())return S.db.cards.filter(function(c){return c.student===m.id});return S.db.cards}
function pajaTag(st){if(st==='hyvaksytty')return '<span class="tag h">Pajan hyväksymä</span>';if(st==='palautettu')return '<span class="tag t">Palautettu sovitettavaksi</span>';return '<span class="tag l">Odottaa pajan sovitusta</span>'}
function curPhase(c){for(var i=0;i<c.phases.length;i++){if(c.phases[i].status==='kesken')return c.phases[i]}for(var j=0;j<c.phases.length;j++){if(c.phases[j].status==='odottaa')return c.phases[j]}return null}
function rateTxt(m){return m.unit==='h'?eur(m.rate)+'/h':eur(m.rate)+'/poltto'}

function render(){
  document.body.classList.toggle('hood',!!S.hood&&!!S.me);
  var app=$('app');
  if(!S.me){app.innerHTML=vLogin();var pw=$('pw');if(pw)pw.focus();return}
  var v=S.view,h='';
  if(v==='tilanne')h=vTilanne();
  else if(v==='kortit')h=S.card?vCard(byId(S.db.cards,S.card)):vCards();
  else if(v==='turva')h=vTurva();
  else if(v==='talous')h=vTalous();
  else if(v==='kierto')h=vKierto();
  else if(v==='kalenteri')h=vKalenteri();
  else if(v==='konepelti')h=vKonepelti();
  else if(v==='johto')h=vJohto();
  app.innerHTML=shell(h)+(S.modal?modalHtml():'')+(S.em?emHtml():'');document.body.classList.toggle('emon',!!S.em);emPublish();

  return h+'</div>';

/* ---- yhdellä silmäyksellä ---- */
var OPEN_H={1:[['09:15','12:00','huolto'],['13:15','17:00']],2:[['09:15','12:00'],['13:15','20:00']],3:[['09:15','12:00'],['13:15','20:00']],4:[['09:15','12:00'],['13:15','20:00']],5:[['09:15','12:00'],['13:15','16:00']]};
function pajaOpen(){
  var d=new Date(),wdn=d.getDay(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  var sl=OPEN_H[wdn];
  if(!sl)return [false,'Suljettu viikonloppuna. Avautuu maanantaina klo 13.15.'];
  for(var i=0;i<sl.length;i++){if(hm>=sl[i][0]&&hm<sl[i][1]){if(sl[i][2])return [false,'Huoltoaamu, pajat avautuvat klo 13.15'];return [true,'Auki klo '+sl[i][1].replace(':','.')+' asti']}}
  for(var j=0;j<sl.length;j++){if(hm<sl[j][0]&&!sl[j][2])return [false,'Avautuu tänään klo '+sl[j][0].replace(':','.').replace(/^0/,'')]}
  if(hm<'09:15'&&wdn===1)return [false,'Huoltoaamu, pajat avautuvat klo 13.15'];
  return [false,'Suljettu. Avautuu seuraavana arkipäivänä klo '+(wdn===5?'13.15 (ma)':'9.15')];
}
function gl(n,label,cls,act,extra){return (act?'<button class="gl '+(cls||'')+'" data-act="'+act+'"'+(extra||'')+'>':'<div class="gl '+(cls||'')+'">')+'<b>'+n+'</b><span>'+label+'</span>'+(act?'</button>':'</div>')}
function glance(){
  var m=me(),h='',op=pajaOpen();
  var openInc=S.db.incidents.filter(function(i){return i.status==='avoin'}).length;
  if(isStudent())return nextStep(m.id);
  h+='<p class="open'+(op[0]?'':' no')+'" style="margin:-6px 0 14px"><i></i>Väreen G-kerroksen pajat: '+esc(op[1])+'</p>';
  h+='<div class="glance">';
  if(isStaff()){
    var waitP=S.db.cards.filter(function(c){return c.paja.state==='odottaa'}).length;
    var drafts=S.db.instructions.filter(function(i){return i.state==='luonnos'||i.pending}).length;
    var taps=S.db.taps.filter(function(t){return t.at===dOff(0)&&t.by===m.id}).length;
    h+=gl(waitP,'työpolkua odottaa sovitustasi','y',waitP?'goView':'',' data-v="kortit"');
    h+=gl(drafts,'ohjetta odottaa hyväksyntääsi','',drafts?'goView':'',' data-v="turva" data-g="turva" data-t="ohjeet"');
    h+=gl(openInc,'avointa häiriöilmoitusta',openInc?'k':'');
    h+=gl(taps,'hoitoapua kirjattu tänään','bl');
  } else if(isLect()){
    var back=S.db.cards.filter(function(c){return c.plan.by===m.id&&c.paja.state==='palautettu'}).length;
    var act=S.db.cards.filter(function(c){return c.plan.by===m.id&&curPhase(c)}).length;
    var deep=S.db.events.filter(function(e){return e.who===m.id&&e.type==='syva'&&e.date>=dOff(0)&&e.date<=wd(4)}).length;
    h+=gl(back,'työpolkua palautettu sinulle','y',back?'goView':'',' data-v="kortit"');
    h+=gl(act,'opiskelijan työtä käynnissä','');
    h+=gl(deep,'syväohjausta tällä viikolla','bl');
    h+=gl(openInc,'avointa häiriöilmoitusta',openInc?'k':'');
  } else if(isProf()){
    var mine=S.db.cards.filter(function(c){return c.prof&&c.prof.by===m.id});
    var pend=mine.filter(function(c){return c.prof.state!=='hyvaksytty'}).length;
    h+=gl(pend,'tutkimuksellista tavoitetta odottaa hyväksyntääsi','y',pend?'goView':'',' data-v="kortit"');
    h+=gl(mine.length,'ohjattavaa työtä pajoilla','');
    h+=gl(mine.filter(function(c){return c.paja.state!=='hyvaksytty'}).length,'työtä odottaa vielä pajan sovitusta','bl');
    h+=gl(openInc,'avointa häiriöilmoitusta',openInc?'k':'');
  } else {
    var down=S.db.machines.filter(function(x){return machState(x)[0]==='bad'}).length;
    var low=S.db.inventory.filter(function(x){return x.qty<x.min}).length;
    var rev=S.db.instructions.filter(function(x){return x.reviewDue&&x.reviewDue<dOff(0)}).length;
    h+=gl(down,'konetta pois käytöstä tai huolto erääntynyt',down?'k':'');
    h+=gl(low,'tuotetta alle hälytysrajan','y',low?'goInv':'');
    h+=gl(rev,'turvallisuusohjetta tarkastamatta','',rev?'goView':'',' data-v="turva" data-g="turva" data-t="ohjeet"');
    h+=gl(openInc,'avointa häiriöilmoitusta','bl');
  }
  return h+'</div>';
}
function nextStep(uidv){
  var cs=S.db.cards.filter(function(c){return c.student===uidv&&curPhase(c)});
  var op=pajaOpen();
  var openTxt='<p class="open'+(op[0]?'':' no')+'" style="margin:-6px 0 14px"><i></i>Pajat: '+esc(op[1])+'</p>';
  if(!cs.length)return openTxt+'<div class="nextstep"><div><div class="k">Seuraava askeleesi</div><h2>Sovi työpolku lehtorin kanssa</h2><p>Kun työpolku on tehty, työpajamestari sovittaa sen pajalle ja näet tässä aina yhden seuraavan askeleen.</p></div></div>';
  var c=cs[0],p=curPhase(c),blk=[];
  if(p.machine){var mm=byId(S.db.machines,p.machine),lv=userLevel(uidv,mm.id),ms=machState(mm);
    if(lv.done<mm.minLv)blk.push('Ajokortti ei vielä riitä itsenäiseen työhön: tee tämä vaihe työpajamestarin ohjauksessa.');

function pathBox(uidv){

  var safe=S.db.instructions.filter(function(i){return i.type==='Turvallisuusohje'&&i.state!=='luonnos'});
  var safeOk=safe.filter(function(i){return !(i.reviewDue&&i.reviewDue<dOff(0))}).length;

  h+='<div class="glance">'+gl(avail+'/'+S.db.machines.length,'konetta käytettävissä',avail<S.db.machines.length?'':'')+gl(pending,'hyväksyntää kesken ketjussa','y')+gl(safeOk+'/'+safe.length,'turvallisuusohjetta ajan tasalla',safeOk<safe.length?'k':'')+gl(tw,'hoitoapua tällä viikolla','bl')+gl(kg+' kg','hukkaa ohjattu jatkoon','')+'</div>';

  // yhteistyön ketju

function normTok(s){
  s=String(s).toLowerCase().replace(/×/g,'x').replace(/(\d)\s*mm/g,'$1mm').replace(/(\d)\s*x\s*(\d)/g,'$1x$2').replace(/[^a-z0-9åäö,x]+/g,' ').replace(/-levy/g,'');
  return s.split(' ').filter(function(t){return t&&t!=='levy'&&t!=='kpl'});
}
function findMatch(name){
  var a=normTok(name),best=null,bs=0;
  S.db.inventory.forEach(function(it){
    var b=normTok(it.name);
    var dim=function(t){return /^\d+(,\d+)?mm$|^\d+x\d+/.test(t)};var da=a.filter(dim).sort().join('|'),db2=b.filter(dim).sort().join('|');
    if(da!==db2)return;
    var common=a.filter(function(t){return b.indexOf(t)>=0}).length;
    var sc=common/Math.max(a.length,b.length);
    if(sc>bs){bs=sc;best=it}
  });
  return bs>=0.5?best:null;
}
function sampleRecv(file){
  var rows=[['Koivuvaneri 12mm 1220x2440',10,'kpl',61.50],['MDF-levy 6 mm 1220x2440',10,'kpl',19.90],['Hiomapaperi P120 rulla 50 m',2,'rll',34.00],['PVA puuliima 1 kg',6,'kg',7.20]];
  return buildRecv({supplier:'s1',doc:'Lähete 48211',date:dOff(0),file:file,simulated:true},rows);
}
function buildRecv(meta,rows){
  meta.rows=rows.map(function(r){var mt=findMatch(r[0]);return {name:r[0],qty:r[1],unit:r[2],price:r[3],match:mt?mt.id:null,merge:!!mt,store:mt?mt.store:'',resp:mt?mt.resp:S.me}});
  return meta;
}

/* ---- Kalenteri ---- */

    h+='<label class="f" for="cS">Opiskelija</label><select id="cS">'+S.db.users.filter(function(u){return u.role==='opiskelija'}).map(function(u){return '<option value="'+u.id+'">'+esc(u.name)+' ('+ASTE[u.aste]+')</option>'}).join('')+'</select>';
    h+='<label class="f" for="cT">Työn nimi</label><input id="cT"><label class="f" for="cC">Kurssi tai projekti</label><input id="cC">';
    h+='<label class="f" for="cN">Työpolku: mitä tehdään ja mitä opitaan</label><textarea id="cN"></textarea>';
    h+='<label class="f" for="cP">Vaiheet, yksi per rivi</label><textarea id="cP" placeholder="Mallinnus&#10;Laserleikkaus&#10;Kokoaminen"></textarea>';
    h+='<label class="f" for="cE">Kustannusarvio (€)</label><input id="cE" type="number" min="0" value="50">';
    h+='<div class="note small">Työpolku menee pajahenkilöstölle sovitettavaksi. Pajamestari päättää, millä koneilla ja menetelmillä se toteutetaan.</div><div id="cErr"></div><div class="btns"><button class="btn p" data-act="cardCreate">Lähetä pajalle</button><button class="btn" data-act="close">Peru</button></div>';
  }
  return h+'</div></div>';
}

  phaseDone:function(d){var c=byId(S.db.cards,d.id);var ix=-1;c.phases.forEach(function(p,i){if(p.id===d.p)ix=i});var p=c.phases[ix];p.status='valmis';

  newInstr:function(){S.modal={k:'newInstr'};render()},
  instrCreate:function(){var t=val('nT').trim();if(!t){$('nT').focus();return}

    if(l.steps.every(function(x){return x.d})){l.status='valmis';l.signedBy=S.me;l.at=dOff(0);log('Kuittasi ajokortin: '+U(l.user).name+', '+byId(S.db.machines,l.machine).name+', taso '+l.level);toast('Ajokortti valmis')}

  invEdit:function(d){S.modal={k:'invEdit',id:d.id};render()},
  invSave:function(d){var w=val('eW').trim();if(!w){$('eErr').innerHTML='<p class="err">Kirjoita peruste. Jokainen muutos kirjataan historiaan.</p>';$('eW').focus();return}
    var it=byId(S.db.inventory,d.id),ch=[];var q=parseFloat(val('eQ')),p=parseFloat(val('eP')),s=val('eS'),r=val('eR');
    if(q!==it.qty){ch.push('saldo '+num(it.qty)+' → '+num(q));it.qty=q}
    if(p!==it.price){ch.push('hinta '+eur(it.price)+' → '+eur(p));it.price=p}
    if(s!==it.store){ch.push('säilytys → '+s);it.store=s}
    if(r!==it.resp){ch.push('vastuu → '+U(r).name);it.resp=r}
    if(ch.length){it.hist.push({at:dOff(0),by:S.me,t:'Käsin: '+ch.join(', ')+'. Peruste: '+w});log('Muokkasi varastoa: '+it.name+' ('+ch.join(', ')+')')}
    save();S.modal=null;render();toast(ch.length?'Muutos tallennettu':'Ei muutoksia')},
  recvSample:function(){S.recv=sampleRecv(null);render()},
  recvCancel:function(){S.recv=null;render()},
  recvApprove:function(){var r=S.recv;r.supplier=val('recvSup');var sup=byId(S.db.suppliers,r.supplier);var n=0;
    r.rows.forEach(function(x){
      var att={name:r.file?r.file.name:r.doc+'.pdf',doc:r.doc,at:r.date};
      if(x.merge&&x.match){var it=byId(S.db.inventory,x.match);var t='Vastaanotettu '+num(x.qty)+' '+it.unit+' ('+r.doc+')';
        if(Math.abs(it.price-x.price)>0.005){t+=', hinta '+eur(it.price)+' → '+eur(x.price);it.price=x.price}
        it.qty=Math.round((it.qty+x.qty)*100)/100;it.src=r.doc;it.att.push(att);it.hist.push({at:dOff(0),by:S.me,t:t})}
      else{var ni={id:uid('it'),name:x.name,cat:'Uusi',unit:x.unit,qty:x.qty,min:0,price:x.price,sup:r.supplier,store:x.store||'Määrittämättä',resp:x.resp||S.me,src:r.doc,att:[att],hist:[{at:dOff(0),by:S.me,t:'Uusi tuote vastaanotossa: '+num(x.qty)+' '+x.unit+' ('+r.doc+')'}]};S.db.inventory.push(ni)}
      n++;
    });
    log('Vastaanotto: '+r.doc+', '+(sup?sup.name:'')+', '+n+' riviä');save();S.recv=null;S.tab.talous='varasto';render();toast('Vastaanotto hyväksytty, varasto päivitetty')},

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='recvMerge')return;
  if(a==='ovClose'){if(e.target===t){S.modal=null;S.editInstr=false;render()}return}
  if(A[a]){if(a!=='emCall')e.preventDefault();A[a](t.dataset,t,e)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute('data-act')==='recvMerge'){S.recv.rows[+t.getAttribute('data-i')].merge=t.checked;render();return}
  if(t.hasAttribute('data-rf')&&S.recv){S.recv.rows[+t.getAttribute('data-i')][t.getAttribute('data-rf')]=t.value;return}
  if(t.id==='recvFile'&&t.files&&t.files[0]){
    var f=t.files[0],info={name:f.name,type:f.type,size:f.size};
    if(/\.(csv|txt)$/i.test(f.name)){
      var rd=new FileReader();
      rd.onload=function(){
        var rows=[];String(rd.result).split(/\r?\n/).forEach(function(line){
          var c=line.split(/[;\t]/);if(c.length<4)return;var q=parseFloat(c[1].replace(',','.')),p=parseFloat(c[3].replace(',','.'));
          if(isNaN(q)||isNaN(p))return;rows.push([c[0].trim(),q,c[2].trim()||'kpl',p]);
        });
        if(!rows.length){toast('Tiedostosta ei löytynyt rivejä muodossa nimi;määrä;yksikkö;hinta');return}
        S.recv=buildRecv({supplier:S.db.suppliers[0].id,doc:'Lähete '+f.name.replace(/\.[^.]+$/,''),date:dOff(0),file:info,simulated:false},rows);render();
      };
      rd.readAsText(f);
    } else {S.recv=sampleRecv(info);render()}
  }
});
document.addEventListener('input',function(e){var t=e.target;if(t.hasAttribute('data-rf')&&S.recv){S.recv.rows[+t.getAttribute('data-i')][t.getAttribute('data-rf')]=t.value}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='pw'){A.login()}
  if(e.key==='Escape'&&S.modal&&!S.em){S.modal=null;S.editInstr=false;render()}
});

emInstall();load();render();
})();
